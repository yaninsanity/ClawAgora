[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawagora"
version = "0.1.0"
description = "Governance-aware agent operating system kernel and HTTP control plane"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ClawAgora contributors" }]
dependencies = [
  "pydantic>=2.6",
]

[project.optional-dependencies]
server = [
  "django>=5.0",
  "djangorestframework>=3.15",
  "django-cors-headers>=4.3",
  "psycopg[binary]>=3.1",
]
async = [
  "django-rq>=2.10",
  "redis>=5.0",
]
dev = [
  "pytest>=8.0",
  "pytest-django>=4.8",
  "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "apps/server"]
DJANGO_SETTINGS_MODULE = "clawagora_server.settings"
addopts = "--ds=clawagora_server.settings"

[tool.ruff]
line-length = 100
target-version = "py311"
