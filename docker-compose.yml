services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    command: sh -c "python apps/server/manage.py migrate && bash scripts/dev.sh"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clawagora
      POSTGRES_USER: clawagora
      POSTGRES_PASSWORD: clawagora
      REDIS_URL: redis://redis:6379/0
      CLAWAGORA_CACHE_URL: redis://redis:6379/1
      CLAWAGORA_EXECUTION_MODE: async
      CLAWAGORA_OPENCLAW_DELEGATE_ENABLED: "1"
      CLAWAGORA_OPENCLAW_DELEGATE_URL: http://bridge:18791/delegate
      CLAWAGORA_PUBLIC_BASE_URL: http://localhost:8000
      CLAWAGORA_OPENCLAW_WEBHOOK_SECRET: change-me
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      bridge:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    command: bash scripts/worker.sh
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: clawagora
      POSTGRES_USER: clawagora
      POSTGRES_PASSWORD: clawagora
      REDIS_URL: redis://redis:6379/0
      CLAWAGORA_CACHE_URL: redis://redis:6379/1
      CLAWAGORA_EXECUTION_MODE: async
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  bridge:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
    command: python examples/openclaw_bridge_mock.py
    environment:
      CLAWAGORA_OPENCLAW_WEBHOOK_SECRET: change-me
    ports:
      - "18791:18791"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 18791), 2); s.close()\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clawagora
      POSTGRES_USER: clawagora
      POSTGRES_PASSWORD: clawagora
    ports:
      - "5432:5432"
    volumes:
      - clawagora_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawagora -d clawagora"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  clawagora_pg:
