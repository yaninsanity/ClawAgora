services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clawagora
      POSTGRES_USER: clawagora
      POSTGRES_PASSWORD: clawagora
    ports:
      - "5432:5432"
    volumes:
      - clawagora_pg:/var/lib/postgresql/data

volumes:
  clawagora_pg:
